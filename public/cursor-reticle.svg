<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <g fill="none" stroke-linejoin="round">
    <!-- dark halo for contrast on light/red backgrounds -->
    <polygon points="14,3 24,23 4,23" stroke="rgba(0,0,0,0.55)" stroke-width="4" />
    <!-- white triangle reticle -->
    <polygon points="14,3 24,23 4,23" stroke="#ffffff" stroke-width="1.6" />
  </g>
  <!-- red dot in the centre -->
  <circle cx="14" cy="16" r="1.8" fill="#cf2424" />
</svg>
